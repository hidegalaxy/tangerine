<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tangerine">
<meta name="theme-color" content="#0e0c0b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icono-192.png">
<title>Tangerine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Una pantalla de móvil, oscura como Lima y Plum: poco por pantalla y un solo color fuerte (mandarina). Azul = correr, menta = movilidad. */
  :root {
    color-scheme: dark;
    --bg: #0e0c0b;
    --surface: #181513;
    --line: #26221f;
    --track: #322c27;
    --text: #f6f2ee;
    --muted: #a59c93;
    --dim: #70685f;
    --tang: #ff9a3c;
    --ink: #0e0c0b;
    --run: #5ec4ff;
    --mov: #8de0ae;
    --bad: #ff6b5e;
    --far: #8a8077;
    --prop: #3f3833;
    --font: 'Space Grotesk', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 var(--font); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button svg { pointer-events: none; }
  button:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 2px solid var(--tang); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .app { height: 100%; display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; position: relative; overflow: hidden; background: var(--bg); }
  @media (min-width: 640px) {
    body { display: flex; align-items: center; justify-content: center; padding-block: 24px; }
    .app { height: min(880px, 100%); width: 400px; border: 1px solid var(--line); border-radius: 40px; }
  }

  header.top { display: flex; align-items: center; gap: 10px; padding: max(22px, calc(env(safe-area-inset-top, 0px) + 8px)) max(20px, env(safe-area-inset-right, 0px)) 8px max(20px, env(safe-area-inset-left, 0px)); }
  .top h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
  .top .fecha { color: var(--muted); font-size: 15px; flex: 1; padding-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip-estado { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--tang); border: 1px solid color-mix(in srgb, var(--tang) 45%, transparent); border-radius: 99px; padding: 4px 9px; white-space: nowrap; }
  .chip-estado.off { color: var(--muted); border-color: var(--track); }
  .mas { width: 40px; height: 40px; border-radius: 13px; border: 1px solid var(--track); background: none; display: grid; place-items: center; flex: 0 0 auto; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
  .eti { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .peq { color: var(--dim); font-size: 13px; margin: 0; line-height: 1.45; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; }

  nav.tabs { display: flex; border-top: 1px solid var(--line); padding: 6px max(12px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .tabs button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; color: var(--dim); font-size: 12px; font-weight: 600; }
  .tabs button[aria-current="page"] { color: var(--tang); }

  .btn { height: 46px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--tang); color: var(--ink); font-weight: 700; }
  .btn.osc { background: var(--ink); color: var(--tang); align-self: flex-start; margin-top: 8px; }
  .btn.sec { background: none; border: 1px solid var(--track); color: var(--text); font-weight: 600; }
  .btn.ancho { width: 100%; height: 52px; }
  .btn.peque { height: 38px; padding: 0 14px; border-radius: 12px; font-size: 14px; }

  /* Today */
  .ahora { background: var(--tang); color: var(--ink); border-radius: 26px; padding: 20px 22px; display: flex; flex-direction: column; gap: 4px; }
  .ahora.k-run { background: var(--run); }
  .ahora.k-mov { background: var(--mov); }
  .ahora .eti { color: rgba(14, 12, 11, .62); }
  .ahora h2 { margin: 0; font-size: 34px; letter-spacing: -.03em; line-height: 1.05; text-wrap: balance; }
  .ahora p { margin: 0; font-weight: 600; opacity: .78; }
  .ahora.quieto { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .ahora.quieto .eti { color: var(--muted); }
  .ahora.quieto h2 { color: var(--tang); display: flex; align-items: center; gap: 10px; }
  .ahora.quieto p { opacity: 1; color: var(--muted); font-weight: 500; }

  .tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .tarjeta p { margin: 0; line-height: 1.45; }
  .tarjeta p b { color: var(--tang); font-weight: 600; }
  .tarjeta.aviso p b { color: var(--text); }
  .tarjeta.aviso { box-shadow: inset 3px 0 0 var(--tang); }
  .linea2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .linea2 b { font-size: 20px; letter-spacing: -.02em; }
  .linea2 span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .pasos { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  .pasos i { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .pasos i em { display: block; height: 100%; background: var(--run); }
  .rv { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 8px; background: var(--track); color: var(--text); font-weight: 700; font-size: 13px; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .rv.mal { background: var(--bad); color: var(--ink); }
  .grande { font-size: 44px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .grande small { font-size: 16px; letter-spacing: 0; color: var(--muted); font-weight: 600; }
  .cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cifras div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cifras b { font-size: 24px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .cifras small { color: var(--muted); font-size: 12px; }

  .semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dd { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border-radius: 14px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .dd i { width: 30px; height: 30px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; color: var(--tang); }
  .dd i.k-run { color: var(--run); }
  .dd i.k-mov { color: var(--mov); }
  .dd i.k-off { color: var(--track); border-style: dashed; }
  .dd.ok i { background: currentColor; }
  .dd.ok i svg { color: var(--ink); }
  .dd.fallo i { color: var(--dim); border-style: dashed; }
  .dd.hoy { background: var(--surface); color: var(--text); }
  .dd small { color: var(--dim); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* Plan */
  .conmuta { display: flex; background: var(--surface); border-radius: 14px; padding: 4px; gap: 4px; }
  .conmuta button { flex: 1; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 600; font-size: 14px; }
  .conmuta button[aria-pressed="true"] { background: var(--track); color: var(--text); }
  .lista { display: flex; flex-direction: column; }
  .pd { display: grid; grid-template-columns: 44px 10px 1fr auto; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 0; text-align: left; }
  .pd:last-child { border-bottom: 0; }
  .pd-dia { display: flex; flex-direction: column; line-height: 1.15; }
  .pd-dia b { font-weight: 600; font-size: 15px; }
  .pd-dia small { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .pt { width: 10px; height: 10px; border-radius: 5px; background: var(--tang); }
  .pt.k-run { background: var(--run); }
  .pt.k-mov { background: var(--mov); }
  .pt.k-off { background: var(--track); }
  .pd-txt { min-width: 0; display: flex; flex-direction: column; }
  .pd-txt b { font-weight: 600; }
  .pd-txt small { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .est { color: var(--dim); font-size: 13px; font-weight: 700; }
  .est.ok { color: var(--tang); }
  .est.hoy { color: var(--ink); background: var(--tang); border-radius: 99px; padding: 3px 9px; }
  .est.mal { color: var(--bad); }

  .semanas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .semanas li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
  .semanas li:last-child { border-bottom: 0; }
  .semanas span { color: var(--dim); font-weight: 700; font-size: 12px; }
  .semanas b { font-weight: 500; min-width: 0; }
  .semanas em { font-style: normal; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .semanas .ok b { color: var(--muted); }
  .semanas .ok em { color: var(--run); }
  .semanas .act b, .semanas .act em { color: var(--run); font-weight: 700; }
  .fases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .fases li { display: flex; flex-direction: column; gap: 2px; }
  .fases b { font-weight: 600; }
  .fases small { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .pausas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .pausas li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .pausas li:last-child { border-bottom: 0; }
  .pausas li div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pausas small { color: var(--muted); }
  .campos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .campos label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 0; }
  .campos .entero { grid-column: 1 / -1; }
  .campos input { height: 44px; border-radius: 12px; border: 1px solid var(--track); background: var(--bg); padding: 0 12px; min-width: 0; width: 100%; }

  /* Progress */
  .mes-cab { display: flex; align-items: center; gap: 8px; }
  .mes-cab b { flex: 1; font-size: 18px; text-transform: capitalize; }
  .mes-cab button { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--track); background: none; }
  .mes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .mes .cab { text-align: center; color: var(--dim); font-size: 11px; font-weight: 700; }
  .c { aspect-ratio: 1; max-width: 100%; border-radius: 9px; display: grid; place-items: center; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; font-style: normal; }
  .c.plan { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--tang) 40%, transparent); }
  .c.plan.k-run { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--run) 40%, transparent); }
  .c.plan.k-mov { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--mov) 40%, transparent); }
  .c.ok { background: var(--tang); color: var(--ink); font-weight: 700; }
  .c.ok.k-run { background: var(--run); }
  .c.ok.k-mov { background: var(--mov); }
  .c.fallo { box-shadow: inset 0 0 0 1.5px var(--track); text-decoration: line-through; }
  .c.pausa { background: repeating-linear-gradient(135deg, var(--surface) 0 4px, var(--line) 4px 6px); }
  .c.hoy { box-shadow: inset 0 0 0 2px var(--text); color: var(--text); font-weight: 700; }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .leyenda span { display: flex; align-items: center; gap: 6px; }
  .leyenda i { width: 10px; height: 10px; border-radius: 3px; background: var(--tang); }
  .leyenda i.k-run { background: var(--run); }
  .leyenda i.k-mov { background: var(--mov); }

  .grafica { width: 100%; display: block; overflow: visible; }
  .g-eje { stroke: var(--line); stroke-width: 1; }
  .g-lim { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .g-txt { fill: var(--dim); font: 600 10px var(--font); }
  .g-lim-txt { fill: var(--bad); font: 700 10px var(--font); }
  .g-linea { fill: none; stroke: var(--run); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .g-area { fill: var(--run); opacity: .12; }
  .g-pt { fill: var(--run); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
  .g-pt.mal { fill: var(--bad); }
  .g-pt.sel { stroke: var(--text); }
  .g-tri { fill: var(--bad); }
  .g-hit { fill: transparent; cursor: pointer; }
  .g-dato { font-size: 13px; color: var(--muted); min-height: 18px; margin: 0; }
  .tabla { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .tabla th { text-align: left; color: var(--dim); font-weight: 600; padding: 4px 0; }
  .tabla td { padding: 5px 0; border-top: 1px solid var(--line); }
  .tabla td:not(:first-child), .tabla th:not(:first-child) { text-align: right; }
  details.ver-tabla summary { color: var(--muted); font-size: 13px; cursor: pointer; }

  .camino { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .camino li { display: grid; grid-template-columns: 18px 1fr auto; gap: 12px; align-items: center; padding: 7px 0; position: relative; }
  .camino li::before { content: ''; position: absolute; left: 8px; top: 50%; bottom: -50%; width: 2px; background: var(--track); }
  .camino li:last-child::before { display: none; }
  .camino i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--track); background: var(--surface); position: relative; z-index: 1; display: grid; place-items: center; }
  .camino .ok i { border-color: var(--tang); background: var(--tang); color: var(--ink); }
  .camino .act i { border-color: var(--tang); }
  .camino .act b { color: var(--tang); }
  .camino b { font-weight: 600; font-size: 15px; }
  .camino em { font-style: normal; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .crono { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px 2px; position: relative; }
  .crono .m { text-align: center; color: var(--dim); font-size: 11px; font-weight: 700; }
  .crono .f { height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink); background: var(--run); overflow: hidden; white-space: nowrap; grid-row: 2; }
  .crono .f2 { background: color-mix(in srgb, var(--run) 72%, var(--bg)); }
  .crono .f3 { background: color-mix(in srgb, var(--run) 52%, var(--bg)); color: var(--text); }
  .crono .f4 { background: var(--tang); }
  .crono .hoy-m { position: absolute; top: 14px; width: 2px; height: 36px; background: var(--text); border-radius: 1px; }

  .escaleras { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .escaleras > li { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .escaleras > li:last-child { border-bottom: 0; }
  .escaleras summary div { min-width: 0; display: flex; flex-direction: column; }
  .escaleras summary b { font-weight: 600; font-size: 15px; color: var(--text); }
  .escaleras summary small { color: var(--muted); font-size: 13px; }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 14px; height: 6px; border-radius: 3px; background: var(--track); }
  .dots i.on { background: var(--tang); }
  .grupo { margin-top: 6px; }

  /* Hoja */
  .hoja { position: absolute; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column; transform: translateY(100%); visibility: hidden; transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .32s; }
  .hoja.abierta { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
  .sh-top { display: flex; align-items: flex-start; gap: 12px; padding: max(22px, calc(env(safe-area-inset-top, 0px) + 8px)) max(20px, env(safe-area-inset-right, 0px)) 10px max(20px, env(safe-area-inset-left, 0px)); }
  .sh-top div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sh-top h2 { margin: 0; font-size: 28px; letter-spacing: -.03em; line-height: 1.1; }
  .sh-top small { color: var(--muted); font-size: 14px; }
  .x { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--track); background: none; display: grid; place-items: center; flex: 0 0 auto; }
  .sh-main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; }
  .sh-main.fin { gap: 14px; padding-top: 6px; }
  .sh-pie { border-top: 1px solid var(--line); padding: 12px max(20px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
  .calienta { margin: 0 0 4px; padding: 12px 14px; border-radius: 16px; background: var(--surface); color: var(--muted); font-size: 14px; line-height: 1.45; }
  .calienta b { color: var(--text); font-weight: 600; }
  .regla { color: var(--dim); font-size: 13px; line-height: 1.5; margin: 14px 0 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--track); background: none; font-size: 14px; font-weight: 600; }
  .chips button small { color: var(--muted); font-weight: 500; margin-left: 4px; }

  .ej { display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .ej-top { display: flex; align-items: baseline; gap: 8px; }
  .par { font-size: 12px; font-weight: 700; color: var(--tang); width: 22px; flex: 0 0 auto; }
  .ej-top b { flex: 1; font-weight: 600; min-width: 0; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--track); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ej .nota, .ej .ult { color: var(--dim); font-size: 13px; padding-left: 30px; }
  .ult .sube { font-style: normal; color: var(--tang); font-weight: 700; margin-left: 6px; }
  .series { display: flex; gap: 8px; flex-wrap: wrap; padding-left: 30px; }
  .serie { width: 54px; height: 54px; border-radius: 16px; border: 1.5px dashed var(--track); background: none; color: var(--dim); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; transition: background .15s; }
  .serie.ok { border: 0; background: var(--tang); color: var(--ink); }
  .serie.corta { background: color-mix(in srgb, var(--tang) 35%, var(--surface)); color: var(--text); }
  .serie.sel { outline: 2px solid var(--text); outline-offset: 2px; }
  .paso { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); padding-left: 30px; }
  .paso button { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--track); background: none; font-size: 20px; font-weight: 600; }
  .paso b { min-width: 80px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums; }
  details.esc { padding-left: 30px; font-size: 13px; color: var(--muted); }
  details.esc summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
  details.esc summary::-webkit-details-marker { display: none; }
  details.esc summary::after { content: '›'; transition: transform .2s; display: inline-block; }
  details.esc[open] summary::after { transform: rotate(90deg); }
  details.esc ol { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
  details.esc li.ok { color: var(--dim); text-decoration: line-through; }
  details.esc li.act { color: var(--tang); font-weight: 700; }
  details.esc ol.claves { color: var(--text); font-size: 14px; line-height: 1.45; gap: 5px; margin: 0; }
  details.ver { padding-left: 0; font-size: inherit; }
  details.ver summary { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; }
  details.ver summary::after { content: none; }

<script>
/* <dibujos> */
/* Dibujos de los ejercicios: muñeco articulado con huesos de longitud fija.
   Manos y pies con objetivo (t) se resuelven con IK de dos huesos, así no se estiran ni se despegan de la barra o del suelo.
   Ángulos en grados de SVG: 0 = derecha, 90 = abajo, -90 = arriba. El muñeco mira a la derecha. */
const HUESO = { torso: 48, brazo: 28, ante: 26, muslo: 38, pierna: 36, cuello: 16, cabeza: 9.5 };
const SUELO = 186;

const rad = a => a * Math.PI / 180;
const dirA = a => [Math.cos(rad(a)), Math.sin(rad(a))];
const mas = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];
const angulo = (A, B) => Math.atan2(B[1] - A[1], B[0] - A[0]) * 180 / Math.PI;
const dist = (A, B) => Math.hypot(B[0] - A[0], B[1] - A[1]);

// Punto a distancia la de A y lb de B (el de arriba o el de abajo)
function triangulo(A, B, la, lb, arriba = true) {
  const d = dist(A, B), ux = (B[0] - A[0]) / d, uy = (B[1] - A[1]) / d;
  const a = (la * la - lb * lb + d * d) / (2 * d), h = Math.sqrt(Math.max(0, la * la - a * a));
  const P = [A[0] + a * ux, A[1] + a * uy];
  const c1 = [P[0] - h * uy, P[1] + h * ux], c2 = [P[0] + h * uy, P[1] - h * ux];
  return (c1[1] < c2[1]) === arriba ? c1 : c2;
}
// Cuerpo recto de tobillo a hombro (flexiones): cadera a 73 del tobillo
function enLinea(F, S) {
  const d = dist(F, S), u = [(S[0] - F[0]) / d, (S[1] - F[1]) / d];
  return { hip: mas(F, u, 73), tr: angulo(F, S) };
}

function ik(A, T, l1, l2, s) {
  const d0 = dist(A, T), a = Math.atan2(T[1] - A[1], T[0] - A[0]);
  if (s === 0) { // rodilla hacia delante en vista de frente: se ve recta y más corta
    const d = Math.min(d0, l1 + l2);
    return [mas(A, [Math.cos(a), Math.sin(a)], d * l1 / (l1 + l2)), mas(A, [Math.cos(a), Math.sin(a)], d)];
  }
  const d = Math.min(Math.max(d0, Math.abs(l1 - l2) + .01), l1 + l2 - .01);
  const th = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  const m = [A[0] + l1 * Math.cos(a + s * th), A[1] + l1 * Math.sin(a + s * th)];
  const b = Math.atan2(T[1] - m[1], T[0] - m[0]);
  return [m, [m[0] + l2 * Math.cos(b), m[1] + l2 * Math.sin(b)]];
}

function miembro(A, spec, l1, l2) {
  const k = spec.k || [1, 1], a1 = l1 * k[0], a2 = l2 * k[1];
  if (spec.t) { const [m, e] = ik(A, spec.t, a1, a2, spec.s); return [A, m, e]; }
  const m = mas(A, dirA(spec.a[0]), a1);
  return [A, m, mas(m, dirA(spec.a[1]), a2)];
}

function esqueleto(p) {
  const td = dirA(p.tr), S = mas(p.hip, td, p.lt || HUESO.torso);
  const perp = [-td[1], td[0]], w = p.ancho || { h: 0, s: 0 };
  const hipN = mas(p.hip, perp, w.h), hipF = mas(p.hip, perp, -w.h);
  const shN = mas(S, perp, w.s), shF = mas(S, perp, -w.s);
  const pie = (pierna, spec) => {
    if (spec.pieL === 0) return null;
    const [, K, E] = pierna;
    const a = spec.pie != null ? spec.pie : angulo(K, E) - 90;
    return [E, mas(E, dirA(a), spec.pieL || 11)];
  };
  const piN = miembro(hipN, p.piN, HUESO.muslo, HUESO.pierna), piF = miembro(hipF, p.piF || p.piN, HUESO.muslo, HUESO.pierna);
  const mid = [(p.hip[0] + S[0]) / 2, (p.hip[1] + S[1]) / 2], curva = p.curva ? mas(mid, perp, p.curva) : null;
  return {
    hip: p.hip, S, hipN, hipF, shN, shF, frente: !!p.ancho, curva,
    cab: mas(S, dirA(p.cabA != null ? p.cabA : p.tr + (p.cab || 0)), p.cue || HUESO.cuello),
    brN: miembro(shN, p.brN, HUESO.brazo, HUESO.ante), brF: miembro(shF, p.brF || p.brN, HUESO.brazo, HUESO.ante),
    piN, piF, pieN: pie(piN, p.piN), pieF: pie(piF, p.piF || p.piN)
  };
}

function mezcla(a, b, t) {
  if (b === undefined) return a;
  if (typeof a === 'number') return a + (b - a) * t;
  if (Array.isArray(a)) return a.map((v, i) => mezcla(v, b[i], t));
  if (a && typeof a === 'object') { const o = {}; for (const k in a) o[k] = k === 's' ? a[k] : mezcla(a[k], b[k], t); return o; }
  return a;
}

const NS = 'http://www.w3.org/2000/svg';

      el('line', { x1: pr.x2 - 6, y1: pr.y, x2: pr.x2 - 6, y2: SUELO, class: 'dj-poste' }, g);
      el('line', { x1: pr.x1, y1: pr.y, x2: pr.x2, y2: pr.y, class: 'dj-barra-l' }, g);
    }

      el('line', { x1: xr, y1: pr.y - 46, x2: xr, y2: SUELO, class: 'dj-poste' }, g);

function poseEn(ex, t) {
  const k = ex.k;
  let tot = 0;
  for (let i = 1; i < k.length; i++) tot += k[i][1];
  t %= tot;
  for (let i = 1; i < k.length; i++) {
    const dur = k[i][1];
    if (t <= dur) { const u = dur ? t / dur : 1; return mezcla(ex.p[k[i - 1][0]], ex.p[k[i][0]], .5 - .5 * Math.cos(Math.PI * u)); }
    t -= dur;

const vivos = new Set();
const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function animarDibujo(d) { if (quieto) { pintarPose(d, d.ex.p[d.ex.k[Math.floor(d.ex.k.length / 2)][0]]); return; } d.t0 = performance.now(); vivos.add(d); if (vivos.size === 1) requestAnimationFrame(bucle); }

    sab: { n: 'Movilidad del sábado', l: [['noventa', '90/90 con cambios', 180], ['flexor', 'Flexor de cadera · izquierda', 45], ['flexor', 'Flexor de cadera · derecha', 45], ['paloma', 'Paloma · izquierda', 90], ['paloma', 'Paloma · derecha', 90], ['sentadilla', 'Sentadilla profunda', 60], ['tobillo', 'Tobillo a la pared · izquierda', 45], ['tobillo', 'Tobillo a la pared · derecha', 45], ['libro', 'Libro abierto · izquierda', 45], ['libro', 'Libro abierto · derecha', 45], ['puente2', 'Puente de glúteo', 45], ['almeja', 'Almeja · izquierda', 45], ['almeja', 'Almeja · derecha', 45], ['colgado', 'Colgado pasivo', 30], [null, 'Descansa', 15], ['colgado', 'Colgado pasivo', 30], ['dislocaciones', 'Dislocaciones con toalla', 45], ['respiracion', 'Respiración, piernas en una silla', 90]] },

  const tramosMov = id => MOV[id].l.map(([d, n, s]) => ({ d, n, s, k: d ? 'mov' : 'walk' }));
  const minutos = tramos => Math.round(tramos.reduce((a, x) => a + x.s, 0) / 60);

        cuando = '≈ ' + MESES[Number(d.slice(5, 7)) - 1] + ' ' + d.slice(0, 4);
      }
      return { ...h, hecho, valor, cuando };
    });
  }

  // Resumen de la semana que empieza en lun.
  function resumen(E, lun) {
    const dias = semana(E, lun), fin = diaMas(lun, 6);
    const plan = dias.filter(x => x.tipo && !x.pausa), hechas = dias.filter(x => x.hecho);
    const reps = l => l.reduce((a, x) => {
      const h = x.hecho;

    diaMas, entre, semanaDia, lunes, corta, fm, correrDe, tramosCorrer, tramosMov, minutos, sugerir,

})();
