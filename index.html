    pausa: '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5.5" width="4" height="13" rx="1" fill="currentColor"/><rect x="13.5" y="5.5" width="4" height="13" rx="1" fill="currentColor"/></svg>',
    izq: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    der: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const nombreDia = d => P.DIAS[P.semanaDia(d)];

  /* ---------- Datos: lo que hay en el servidor + lo que aún no ha llegado ---------- */
  const LS = {
    get(k, d) { try { const v = localStorage.getItem('tangerine.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('tangerine.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  let LOG = DEMO ? DEMO.log : LS.get('log', []);
  let COLA = DEMO ? [] : LS.get('cola', []);
  let CALENDARIO = LS.get('calendario', true);
  let E = null;
  let tab = LS.get('tab', 'today');
  if (!['today', 'plan', 'progress'].includes(tab)) tab = 'today';
  let semOff = 0, mesOff = 0, ses = null, desc = null, enviando = false, sinRed = false, ptSel = null;
  const abiertos = new Set();

  function hoyDe() {
    if (DEMO) return DEMO.hoy;
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function recalcular() {
    const ids = new Set(LOG.map(e => e.id));
    E = P.estado(LOG.concat(COLA.filter(e => !ids.has(e.id))));
  }
  const nuevoId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // Todo se guarda primero en el móvil y se envía cuando hay conexión.
  function registrar(tipo, datos, aviso) {
    // En la demo, lo nuevo va con la fecha de la demo para quedar después de los datos de ejemplo.
    const cuando = DEMO ? DEMO.hoy + new Date().toISOString().slice(10) : new Date().toISOString();
    const e = Object.assign({ id: nuevoId(), cuando, tipo }, datos);
    COLA.push(e);
    if (!DEMO) LS.set('cola', COLA);
    recalcular();
    pintar();
    if (aviso) avisar(aviso);
    enviar();
    return e;
  }

  function leerApi() {
    const q = new URLSearchParams(location.search).get('api');
    let id = q && /^[\w-]{20,}$/.test(q) ? q : '';
    if (id) { try { localStorage.setItem('tangerine.api', JSON.stringify(id)); } catch (e) {} }
    else { try { id = JSON.parse(localStorage.getItem('tangerine.api') || '""'); } catch (e) {} }
    return id ? 'https://script.google.com/macros/s/' + id + '/exec' : '';
  }
  function leerClave() {
    const dk = document.body.dataset.k;
    if (dk && !dk.startsWith('<?')) return dk;
    const q = new URLSearchParams(location.search).get('k');
    if (q) { try { localStorage.setItem('tangerine.k', JSON.stringify(q)); } catch (e) {} return q; }
    try { return JSON.parse(localStorage.getItem('tangerine.k') || '""'); } catch (e) { return ''; }
  }
  const conectado = () => !DEMO && (EN_GOOGLE || (API && K));

  function run(fn, ...args) {
    if (EN_GOOGLE) return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](K, ...args));
    return llamarApi(fn, args);
  }
  // text/plain evita la comprobación previa del navegador, que el servidor de Google no contesta.
  async function llamarApi(fn, args) {
    const r = fn === 'datos'
      ? await fetch(API + '?accion=datos&k=' + encodeURIComponent(K))
      : await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: K, que: args[0], d: args[1] }) });
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('El servidor no ha contestado bien'); }
    if (j && j.error) throw new Error(j.error);
    return j;
  }
  function aplicar(d) {
    LOG = d.log || [];
    CALENDARIO = d.calendario !== false;
    LS.set('log', LOG);
    LS.set('calendario', CALENDARIO);
  }
  async function cargar() {
    if (!conectado()) return;
    try {
      aplicar(await run('datos'));
      sinRed = false;
    } catch (e) {
      if (/clave/i.test(e.message)) return pantallaClave(e.message);
      sinRed = true;
    }
    recalcular();
    pintar();
    enviar();
  }
  async function enviar() {
    if (!conectado() || enviando || !COLA.length) return pintarEstado();
    enviando = true;
    pintarEstado();
    try {
      const r = await run('accion', 'anadir', { entradas: COLA.slice() });
      aplicar(r.datos);
      const ok = new Set(r.ids || []);
      COLA = COLA.filter(e => !ok.has(e.id));
      LS.set('cola', COLA);
      sinRed = false;
    } catch (e) {
      sinRed = true;
    }
    enviando = false;
    recalcular();
    pintar();
    // Lo que se apuntó mientras se enviaba sale ahora.
    if (COLA.length && !sinRed) setTimeout(enviar, 0);
  }
  window.addEventListener('online', enviar);
  setInterval(() => { if (COLA.length) enviar(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !ses) cargar(); });

  function pintarEstado() {
    const c = $('estado');
    let t = '';
    if (DEMO) t = 'Ejemplo';
    else if (enviando) t = 'Enviando…';
    else if (COLA.length) t = COLA.length + ' sin enviar';
    else if (sinRed) t = 'Sin conexión';
    c.hidden = !t;
    c.textContent = t;
    c.classList.toggle('off', !DEMO);
  }

  function pantallaClave(error) {
    $('nav').hidden = true;
    main.innerHTML = !API
      ? `<section class="tarjeta"><b>Falta conectar tu servidor</b><p class="sub">Abre Tangerine con el enlace o el QR que te dio tu servidor de Google (la dirección que acaba en /exec). Solo la primera vez.</p></section>`
      : `<form class="tarjeta" id="formClave" autocomplete="off"><p class="sub">${error ? esc(error) + '. ' : ''}Escribe tu clave (solo la primera vez).</p>
          <div class="campos"><label class="entero">Clave<input id="campoClave" autocapitalize="off" autocorrect="off" spellcheck="false"></label></div>
          <button class="btn">Entrar</button></form>`;
    const f = $('formClave');
    if (f) f.onsubmit = ev => { ev.preventDefault(); const c = $('campoClave').value.trim(); if (c) location.href = location.pathname + '?k=' + encodeURIComponent(c); };
  }

  let avisoT = null;
  function avisar(t) {
    const a = $('avisoFlotante');
    a.textContent = t;
    a.classList.add('ver');
    clearTimeout(avisoT);
    avisoT = setTimeout(() => a.classList.remove('ver'), 2600);
  }

  /* ---------- Sonido y pantalla ---------- */
  let ac = null, lock = null;
  function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  function pitido(f, d) {
    if (!ac) return;
    try {
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.3, t + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .05);
    } catch (e) {}
  }
  async function pedirPantalla() { try { if (!lock && navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  function soltarPantalla() { try { lock && lock.release(); } catch (e) {} lock = null; }

  /* ---------- Textos ---------- */
  function resumenDe(h) {
    if (!h) return '';
    if (h.plan === 'run') return `${h.minutos || ''} min · rodilla ${h.rodilla} sobre 10`;
    if (h.plan === 'test') return `Dominadas ${h.prueba.dominadas} · fondos ${h.prueba.fondos} · flexiones ${h.prueba.flexiones}`;
    if (h.plan === 'sab') return `${h.minutos || ''} min de movilidad`;
    const rep = Object.keys(h.series || {}).filter(id => P.EJ[id] && P.EJ[id].u !== 's').reduce((a, id) => a + h.series[id].reduce((b, v) => b + (v || 0), 0), 0);
    return `${rep} repes${h.sube && h.sube.length ? ' · ' + h.sube.length + ' escalón' + (h.sube.length > 1 ? 'es' : '') + ' nuevo' + (h.sube.length > 1 ? 's' : '') : ''}`;
  }
  const etiDia = (d, hoy) => d === hoy ? 'Hoy' : d === P.diaMas(hoy, 1) ? 'Mañana' : d === P.diaMas(hoy, -1) ? 'Ayer' : nombreDia(d).charAt(0).toUpperCase() + nombreDia(d).slice(1);
  // Para cabeceras: «Hoy · mié 2 dic» o solo «vie 27 nov».
  const etiFecha = (d, hoy) => (['Hoy', 'Mañana', 'Ayer'].includes(etiDia(d, hoy)) ? etiDia(d, hoy) + ' · ' : '') + P.corta(d);

  /* ---------- Today ---------- */
  function vHoy() {
    const hoy = hoyDe(), x = P.dia(E, hoy), k = P.clase(x.tipo);
    let h = '';

    P.pendientes(E, hoy).forEach(p => {
      const run = p.tipo === 'run';
      h += `<section class="tarjeta aviso"><p><b>El ${nombreDia(p.dia)} no hiciste ${P.titulo(p.tipo).toLowerCase()}.</b> ${run ? 'No pasa nada: la semana de correr solo se alarga.' : p.hueco ? `Puedes pasarla al ${nombreDia(p.hueco)}${p.hueco === hoy ? ' (hoy)' : ''} en lugar de la movilidad.` : 'Esta semana ya no queda hueco: sáltala y sigue normal.'}</p>
        <div class="fila">${p.hueco ? `<button class="btn peque" data-mover="${p.dia}" data-a="${p.hueco}">Pasar al ${nombreDia(p.hueco)}</button>` : ''}<button class="btn sec peque" data-saltar="${p.dia}">Saltar</button></div></section>`;
    });

    if (x.pausa) h += `<section class="ahora quieto"><span class="eti">Hoy</span><h2>${esc(x.pausa)}</h2><p>Hoy no hay entreno.</p></section>`;
    else if (!x.tipo) h += `<section class="ahora quieto"><span class="eti">Hoy</span><h2>Descanso</h2><p>${hoy < P.INICIO ? 'El plan empieza el lunes ' + Number(P.INICIO.slice(8)) + ' de noviembre.' : 'Hoy toca descansar.'}</p></section>`;
    else if (x.hecho) {
      const sig = siguiente(hoy);
      h += `<section class="ahora quieto"><span class="eti">Hoy · hecho</span><h2>${P.titulo(x.tipo)} ${ico.checkG}</h2><p>${esc(resumenDe(x.hecho))}</p>${sig ? `<p>${etiDia(sig.dia, hoy)} ${sig.hora} · ${P.titulo(sig.tipo)}</p>` : ''}</section>`;
    } else if (x.saltado) h += `<section class="ahora quieto"><span class="eti">Hoy</span><h2>Saltado</h2><p>${P.titulo(x.tipo)} no cuenta esta vez.</p><button class="btn sec peque" style="align-self:flex-start;margin-top:8px" data-volver="${hoy}">Deshacer</button></section>`;
    else h += `<section class="ahora k-${k}"><span class="eti">Hoy · ${x.hora}</span><h2>${P.titulo(x.tipo)}</h2><p>${esc(P.detalle(E, x))}</p><button class="btn osc" data-abrir="${hoy}">Empezar</button></section>`;

    const ayer = P.dia(E, P.diaMas(hoy, -1));
    if (ayer.hecho && ayer.hecho.plan === 'run') {
      const r = E.rodilla.find(z => z.k === 'manana' && z.dia === hoy);
      h += r
        ? `<section class="tarjeta"><p>${r.v === 'peor' ? 'Apuntado: la salida de ayer no cuenta y la repites. Si en unos días sigue peor, toca fisio.' : 'Rodilla bien. Sigues con el plan.'}</p></section>`
        : `<section class="tarjeta aviso"><p><b>Ayer corriste.</b> ¿Cómo está hoy la rodilla derecha?</p><div class="fila"><button class="btn sec peque" data-rod="igual">Como siempre</button><button class="btn sec peque" data-rod="peor">Peor</button></div></section>`;
    }

    if (!x.hecho && !x.pausa && (x.tipo === 'A' || x.tipo === 'B')) {
      const sube = P.SESIONES[x.tipo].filter(([, id, n]) => P.sugerir(P.EJ[id], E.paso[id], E.ult[id], n).sube).map(([, id]) => P.EJ[id]);
      if (sube.length) h += `<section class="tarjeta"><p>Hoy subes de escalón en <b>${sube.map(e => e.n.toLowerCase()).join(' y ')}</b>: pasas a ${sube.map(e => e.esc[E.paso[Object.keys(P.EJ).find(i => P.EJ[i] === e)] + 1].toLowerCase()).join(', ')}.</p></section>`;
    }

    const sd = P.semanaDia(hoy);
    if (sd === 6 || sd === 0) h += tarjetaResumen(sd === 6 ? P.lunes(hoy) : P.diaMas(P.lunes(hoy), -7), sd === 6);

    h += `<section><div class="semana">${P.semana(E, P.lunes(hoy)).map(d => tiraDia(d, hoy)).join('')}</div></section>`;
    h += tarjetaCorrer(hoy);
    const sem = Math.ceil(P.entre(hoy, P.CARRERA.dia) / 7);
    h += `<section class="tarjeta"><span class="eti">${P.CARRERA.nombre}</span><div class="grande">${sem} <small>semanas</small></div><p class="sub">Finales de octubre de 2027 (fecha por confirmar) · llana, ${P.CARRERA.lugar}</p></section>`;
    return h;
  }
  function siguiente(desde) {
    for (let i = 1; i < 10; i++) { const y = P.dia(E, P.diaMas(desde, i)); if (y.tipo && !y.pausa && !y.saltado && !y.hecho) return y; }
    return null;
  }
  function tiraDia(d, hoy) {
    const k = d.pausa ? 'off' : P.clase(d.tipo);
    const fallo = !d.hecho && d.dia < hoy && P.esFuerte(d.tipo) && !d.pausa;
    return `<button class="dd ${d.hecho ? 'ok' : ''} ${fallo || d.saltado ? 'fallo' : ''} ${d.dia === hoy ? 'hoy' : ''}" data-dia="${d.dia}" aria-label="${nombreDia(d.dia)}: ${d.pausa || P.titulo(d.tipo)}${d.hecho ? ', hecho' : ''}"><span>${'LMXJVSD'[P.semanaDia(d.dia)]}</span><i class="k-${k}">${d.hecho ? ico.check : ''}</i><small>${Number(d.dia.slice(8))}</small></button>`;
  }
  function tarjetaCorrer(hoy) {
    const c = E.correr, f1 = c.sem < P.CORRER.length;
    const prox = (() => { for (let i = 0; i < 10; i++) { const y = P.dia(E, P.diaMas(hoy, i)); if (y.tipo === 'run' && !y.hecho && !y.pausa && !y.saltado) return y; } return null; })();
    const rod = E.rodilla.filter(r => r.k === 'run').slice(-6);
    return `<section class="tarjeta"><span class="eti">${f1 ? 'Volver a correr' : 'Correr · ' + P.faseDe(hoy).n}</span>
      <div class="linea2"><b>Semana ${c.sem + 1}${f1 ? ' de 9' : ''}</b><span>${c.hechas} de 3 salidas</span></div>
      ${f1 ? `<div class="pasos">${P.CORRER.map((_, i) => `<i><em style="width:${i < c.sem ? 100 : i === c.sem ? c.hechas / 3 * 100 : 0}%"></em></i>`).join('')}</div>` : ''}
      ${prox ? `<p class="sub">Próxima: ${etiDia(prox.dia, hoy).toLowerCase()} ${prox.hora} · ${esc(P.correrDe(c.sem).texto)}</p>` : ''}
      ${rod.length ? `<p class="sub">Rodilla al correr: ${rod.map(r => `<span class="rv ${r.v > 3 ? 'mal' : ''}">${r.v >= 6 ? '6+' : r.v}</span>`).join('')} · límite 3</p>` : ''}</section>`;
  }
  function tarjetaResumen(lun, enCurso) {
    const r = P.resumen(E, lun), dif = r.reps - r.repsAntes;
    return `<section class="tarjeta"><span class="eti">${enCurso ? 'Tu semana' : 'La semana pasada'} · ${Number(lun.slice(8))}–${Number(r.fin.slice(8))} ${P.MESES[Number(r.fin.slice(5, 7)) - 1]}</span>
      <div class="cifras"><div><b>${r.hechas}/${r.plan}</b><small>sesiones</small></div><div><b>${r.reps}</b><small>repes${r.repsAntes ? ` · ${dif >= 0 ? '+' : ''}${dif}` : ''}</small></div><div><b>${r.corriendo}′</b><small>corriendo · ${r.salidas} salidas</small></div></div>
      ${r.subidas.length ? `<p>Escalón nuevo: ${r.subidas.map(s => `<b>${esc(P.EJ[s.id].n.toLowerCase())}</b> → ${esc(s.a.toLowerCase())}`).join(', ')}.</p>` : ''}
      ${r.rodilla.length ? `<p class="sub">Rodilla: ${r.rodilla.map(z => z.k === 'run' ? `<span class="rv ${z.v > 3 ? 'mal' : ''}">${z.v}</span>` : `<span class="rv ${z.v === 'peor' ? 'mal' : ''}">${z.v === 'peor' ? 'peor' : 'ok'}</span>`).join('')}</p>` : ''}
      ${enCurso ? `<p class="sub">La que viene: ${r.siguiente.map(d => d.pausa ? '—' : ({ A: 'A', B: 'B', test: 'Prueba', run: 'Correr', sab: 'Mov.' }[d.tipo] || '—')).join(' · ')}</p>` : ''}</section>`;
  }

  /* ---------- Plan ---------- */
  function vPlan() {
    const hoy = hoyDe(), lun = P.diaMas(P.lunes(hoy), 7 * semOff);
    const filas = P.semana(E, lun).map(d => {
      const k = d.pausa ? 'off' : P.clase(d.tipo);
      const fallo = !d.hecho && d.dia < hoy && P.esFuerte(d.tipo) && !d.pausa && !d.saltado;
      const est = d.hecho ? `<span class="est ok">${ico.check}</span>` : d.saltado ? '<span class="est">saltado</span>' : fallo ? '<span class="est mal">sin hacer</span>' : d.dia === hoy ? '<span class="est hoy">Hoy</span>' : '<span class="est">›</span>';
      const sub = d.pausa ? 'Pausa' : !d.tipo ? 'Descanso' : `${d.hora} · ${({ A: 'calistenia + 8′ de movilidad', B: 'calistenia + 8′ de movilidad', test: 'prueba de 4 semanas', run: P.correrDe(E.correr.sem).texto, sab: P.minutos(P.tramosMov('sab')) + '′, antes del cau' })[d.tipo]}${d.movido ? ' · movido' : ''}`;
      return `<button class="pd" data-dia="${d.dia}"><span class="pd-dia"><b>${P.DIAS[P.semanaDia(d.dia)].slice(0, 3)}</b><small>${Number(d.dia.slice(8))} ${P.MESES[Number(d.dia.slice(5, 7)) - 1]}</small></span><i class="pt k-${k}"></i><span class="pd-txt"><b>${esc(d.pausa || P.titulo(d.tipo))}</b><small>${esc(sub)}</small></span>${est}</button>`;
    }).join('');
    const c = E.correr;
    const filasR = P.CORRER.map((w, i) => {
      const st = i < c.sem ? 'ok' : i === c.sem ? 'act' : '';
      return `<li class="${st}"><span>S${i + 1}</span><b>${esc(P.correrDe(i).texto)}</b><em>${i < c.sem ? ico.check : i === c.sem ? c.hechas + '/3' : ''}</em></li>`;
    }).join('');
    const pausas = E.pausas.filter(p => p.hasta >= hoy);
    return `
      <div class="conmuta" role="group"><button data-sem="0" aria-pressed="${semOff === 0}">Esta semana</button><button data-sem="1" aria-pressed="${semOff === 1}">La próxima</button></div>
      <section><div class="lista">${filas}</div><p class="peq">Toca un día para empezarlo, moverlo o saltarlo. Cada 4.ª semana, el viernes toca prueba.</p></section>
      <section class="tarjeta"><span class="eti">Salidas y viajes</span>
        ${pausas.length ? `<ul class="pausas">${pausas.map(p => `<li><div><b>${esc(p.motivo)}</b><small>${P.corta(p.desde)} – ${P.corta(p.hasta)}</small></div>${p.fija ? '' : `<button class="btn sec peque" data-quitar-pausa="${p.id}">Quitar</button>`}</li>`).join('')}</ul>` : '<p class="sub">No hay ninguna apuntada.</p>'}
        <form id="formPausa" class="campos" autocomplete="off">
          <label class="entero">Qué es<input id="pMotivo" placeholder="Salida del cau" maxlength="40"></label>
          <label>Desde<input id="pDesde" type="date" value="${hoy}"></label>
          <label>Hasta<input id="pHasta" type="date" value="${P.diaMas(hoy, 1)}"></label>
          <button class="btn sec entero">Añadir: esos días no hay entreno</button>
        </form></section>
      <section class="tarjeta"><span class="eti">Volver a correr · fase 1</span>
        <p class="sub">5′ andando antes y después. La semana avanza con 3 salidas buenas, no con el calendario.</p>
        <ol class="semanas">${filasR}</ol></section>
      <section class="tarjeta"><span class="eti">Regla de la rodilla</span>
        <p>Mientras corres puede molestar <b>3 sobre 10</b> como mucho, y a la mañana siguiente tiene que estar como siempre. Si no, repites la semana. Si va a más mientras corres, paras y vuelves andando.</p></section>
      <section class="tarjeta"><span class="eti">Después, hasta la media</span>
        <ol class="fases">
          <li><b>Ene–abr · Base</b><small>3 salidas fáciles de 30–45′. La del domingo sube 5′ por semana hasta 60′. Cada 4.ª semana se descarga.</small></li>
          <li><b>May–jun · 10K cómodo</b><small>De 20 a 25 km por semana, subiendo un 10 % como mucho.</small></li>
          <li><b>Jul–oct · Plan de media</b><small>16 semanas, con la larga hasta 18–19 km y algo de ritmo de carrera.</small></li>
        </ol></section>`;
  }

  /* ---------- Progress ---------- */
  function vProg() {
    const hoy = hoyDe();
    const base = new Date(Date.UTC(+hoy.slice(0, 4), +hoy.slice(5, 7) - 1 + mesOff, 1));
    const m1 = base.toISOString().slice(0, 10), nDias = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth() + 1, 0)).getUTCDate();
    let mes = 'LMXJVSD'.split('').map(x => `<span class="cab">${x}</span>`).join('');
    for (let b = 0; b < P.semanaDia(m1); b++) mes += '<i class="c"></i>';
    let hechas = 0, plan = 0;
    for (let i = 0; i < nDias; i++) {
      const d = P.dia(E, P.diaMas(m1, i)), k = P.clase(d.tipo);
      let st = '';
      if (d.pausa) st = 'pausa';
      else if (d.tipo) {
        st = d.hecho ? 'ok' : d.dia === hoy ? 'hoy' : d.dia < hoy && P.esFuerte(d.tipo) && !d.saltado ? 'fallo' : 'plan';
        if (d.dia <= hoy) { plan++; if (d.hecho) hechas++; }
      } else if (d.dia === hoy) st = 'hoy';
      mes += `<i class="c k-${k} ${st}">${i + 1}</i>`;
    }
    const hit = P.hitos(E, hoy);
    const iAct = hit.findIndex(x => !x.hecho);
    const pr = E.pruebas;
    const meses = 'NDEFMAMJJASO'.split('').map(m => `<span class="m">${m}</span>`).join('');
    const pos = Math.max(0, Math.min(1, P.entre('2026-11-01', hoy) / P.entre('2026-11-01', '2027-10-31')));
    const GR = ['Tirón', 'Empuje', 'Pierna y cadera', 'Abdomen'];
    const escs = GR.map(g => `<div class="eti grupo">${g}</div><ul class="escaleras">${Object.keys(P.EJ).filter(id => P.EJ[id].grupo === g).map(id => {
      const e = P.EJ[id], paso = E.paso[id];
      return `<li><details class="esc ver"><summary><div><b>${e.n}</b><small>${e.esc[paso]}</small></div><span class="dots" aria-label="Escalón ${paso + 1} de ${e.esc.length}">${e.esc.map((_, i) => `<i class="${i <= paso ? 'on' : ''}"></i>`).join('')}</span></summary>${como(id, e, paso)}</details></li>`;
    }).join('')}</ul>`).join('');
    const posturas = [];
    Object.values(P.MOV).forEach(m => m.l.forEach(([d, n]) => { if (d && !posturas.some(x => x[0] === d)) posturas.push([d, n.replace(/ · (izquierda|derecha)$/, '')]); }));
    const semanas = [];
    for (let i = 0; i < 4; i++) { const l = P.diaMas(P.lunes(hoy), -7 * i); if (l >= P.INICIO) semanas.push(P.resumen(E, l)); }
    return `
      <section class="tarjeta">
        <div class="mes-cab"><b>${MESES_L[base.getUTCMonth()]} ${base.getUTCFullYear()}</b><button data-mes="-1" aria-label="Mes anterior">${ico.izq}</button><button data-mes="1" aria-label="Mes siguiente">${ico.der}</button></div>
        ${plan ? `<div class="linea2"><b>${hechas} de ${plan} sesiones</b><span>${mesOff === 0 ? 'hasta hoy' : ''}</span></div>` : ''}
        <div class="mes">${mes}</div>
        <div class="leyenda"><span><i></i>Calistenia</span><span><i class="k-run"></i>Correr</span><span><i class="k-mov"></i>Movilidad</span></div></section>
      ${tarjetaRodilla()}
      <section class="tarjeta"><span class="eti">Camino al muscle-up</span>
        <ol class="camino"><li class="ok"><i>${ico.check}</i><b>Negativas</b><em>desde el ${Number(P.INICIO.slice(8))}/11</em></li>${hit.map((x, i) => `<li class="${x.hecho ? 'ok' : i === iAct ? 'act' : ''}"><i>${x.hecho ? ico.check : ''}</i><b>${x.n}</b><em>${x.hecho ? 'hecho' : esc(x.cuando)}</em></li>`).join('')}</ol>
        <table class="tabla"><thead><tr><th>Prueba</th><th>Dominadas</th><th>Fondos</th><th>Flexiones</th></tr></thead><tbody>${pr.slice(-5).map(p => `<tr><td>${p.inicial ? 'Punto de partida' : P.corta(p.dia)}</td><td>${p.dominadas}</td><td>${p.fondos}</td><td>${p.flexiones}</td></tr>`).join('')}</tbody></table>
        <p class="peq">Las fechas se recalculan con cada prueba (cada 4 semanas).</p></section>
      <section class="tarjeta"><span class="eti">Camino a la media</span>
        <div class="crono">${meses}<span class="f" style="grid-column:1/3">→ 30′</span><span class="f f2" style="grid-column:3/7">Base</span><span class="f f3" style="grid-column:7/9">10K</span><span class="f f4" style="grid-column:9/13">Media</span><i class="hoy-m" style="left:calc(${(pos * 100).toFixed(1)}% - 1px)"></i></div>
        <p class="sub">Ahora: ${P.faseDe(hoy).n} · carrera a finales de octubre de 2027</p></section>
      ${semanas.length ? `<section class="tarjeta"><span class="eti">Semanas</span><table class="tabla"><thead><tr><th>Semana</th><th>Sesiones</th><th>Repes</th><th>Corriendo</th></tr></thead><tbody>${semanas.map(r => `<tr><td>${Number(r.lun.slice(8))} ${P.MESES[Number(r.lun.slice(5, 7)) - 1]}</td><td>${r.hechas}/${r.plan}</td><td>${r.reps}</td><td>${r.corriendo}′</td></tr>`).join('')}</tbody></table></section>` : ''}
      <section class="tarjeta"><span class="eti">Ejercicios y escaleras</span><p class="peq">Toca uno para ver cómo se hace.</p>${escs}</section>
      <section class="tarjeta"><span class="eti">Posturas de movilidad</span><ul class="escaleras">${posturas.map(([d, n]) => `<li><details class="esc ver"><summary><div><b>${esc(n)}</b></div></summary>${comoPostura(d)}</details></li>`).join('')}</ul></section>`;
  }

  // Rodilla durante cada salida (0–10) en el tiempo, con el límite de 3 y las mañanas «peor».
  function tarjetaRodilla() {
    const runs = E.rodilla.filter(r => r.k === 'run');
    const peor = E.rodilla.filter(r => r.k === 'manana' && r.v === 'peor');
    if (!runs.length) return `<section class="tarjeta"><span class="eti">Rodilla derecha al correr</span><p class="sub">Después de cada salida apuntas cuánto te molestaba, de 0 a 10. Aquí verás cómo va semana a semana.</p></section>`;
    const W = 320, H = 150, L = 22, R = 10, T = 12, B = 22;
    const d0 = runs[0].dia, d1 = runs[runs.length - 1].dia, span = Math.max(7, P.entre(d0, d1));
    const X = d => L + (W - L - R) * P.entre(d0, d) / span, Y = v => T + (H - T - B) * (1 - Math.min(v, 6) / 6);
    const pts = runs.map(r => [X(r.dia), Y(r.v)]);
    const linea = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
    const area = linea + ` L${pts[pts.length - 1][0].toFixed(1)} ${Y(0)} L${pts[0][0].toFixed(1)} ${Y(0)} Z`;
    const ticks = [0, 3, 6].map(v => `<line class="g-eje" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="g-txt" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${v === 6 ? '6+' : v}</text>`).join('');
    const fechas = [d0, d1].map((d, i) => `<text class="g-txt" x="${X(d)}" y="${H - 6}" text-anchor="${i ? 'end' : 'start'}">${Number(d.slice(8))} ${P.MESES[Number(d.slice(5, 7)) - 1]}</text>`).join('');
    const tri = peor.filter(r => r.dia >= d0).map(r => { const x = X(r.dia), y = Y(0) - 2; return `<path class="g-tri" d="M${x - 5} ${y} L${x + 5} ${y} L${x} ${y - 8} Z"><title>${P.corta(r.dia)}: la mañana después, peor</title></path>`; }).join('');
    const marcas = runs.map((r, i) => `<circle class="g-pt ${r.v > 3 ? 'mal' : ''} ${ptSel === i ? 'sel' : ''}" cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="5"/><circle class="g-hit" data-pt="${i}" cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="13"><title>${P.corta(r.dia)}: ${r.v} sobre 10</title></circle>`).join('');
    const sel = ptSel != null && runs[ptSel] ? runs[ptSel] : runs[runs.length - 1];
    return `<section class="tarjeta"><span class="eti">Rodilla derecha al correr</span>
      <svg class="grafica" viewBox="0 0 ${W} ${H}" role="img" aria-label="Molestia de la rodilla en cada salida, de 0 a 10">
        ${ticks}<line class="g-lim" x1="${L}" x2="${W - R}" y1="${Y(3)}" y2="${Y(3)}"/><text class="g-lim-txt" x="${W - R}" y="${Y(3) - 5}" text-anchor="end">límite</text>
        <path class="g-area" d="${area}"/><path class="g-linea" d="${linea}"/>${tri}${marcas}${fechas}</svg>
      <p class="g-dato">${P.corta(sel.dia)}: <b>${sel.v} sobre 10</b>${sel.v > 3 ? ' · por encima del límite' : ''}</p>
      ${peor.length ? '<p class="peq">▲ Mañanas en las que la rodilla estaba peor.</p>' : ''}
      <details class="ver-tabla"><summary>Ver como tabla</summary><table class="tabla"><thead><tr><th>Día</th><th>Rodilla</th></tr></thead><tbody>${E.rodilla.slice().reverse().map(r => `<tr><td>${P.corta(r.dia)}${r.k === 'manana' ? ' (mañana)' : ''}</td><td>${r.k === 'run' ? r.v + '/10' : r.v}</td></tr>`).join('')}</tbody></table></details></section>`;
  }

  function como(id, e, paso) {
    const dj = DIBUJOS[id], de = dj ? dj.dibEsc || 0 : 0;
    return `<div class="como">
      ${dj ? `<div class="dj-slot" data-id="${id}"></div>
      ${de !== paso ? `<p class="peq">El dibujo es del escalón «${esc(e.esc[de])}».</p>` : ''}
      <ol class="claves">${dj.pasos.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
      ${dj.foco ? '<p class="peq"><span class="pt-foco"></span>Donde lo tienes que notar.</p>' : ''}` : ''}
      <span class="eti">Escalera · escalón ${paso + 1} de ${e.esc.length}</span>
      <ol>${e.esc.map((x, i) => `<li class="${i < paso ? 'ok' : i === paso ? 'act' : ''}">${esc(x)}</li>`).join('')}</ol></div>`;
  }
  function comoPostura(d) {
    const dj = DIBUJOS[d];
    return `<div class="como"><div class="dj-slot" data-id="${d}"></div><ol class="claves">${dj.pasos.map(x => `<li>${esc(x)}</li>`).join('')}</ol>${dj.foco ? '<p class="peq"><span class="pt-foco"></span>Donde lo tienes que notar.</p>' : ''}</div>`;
  }
  function montarDibujos(raiz) {
    raiz.querySelectorAll('details[open] .dj-slot:empty').forEach(s => { const d = crearDibujo(s.dataset.id); s.appendChild(d.svg); animarDibujo(d); });
  }

  function pintar() {
    if (!E) recalcular();
    const hoy = hoyDe();
    $('fecha').textContent = P.corta(hoy);
    const top = main.scrollTop;
    main.innerHTML = tab === 'today' ? vHoy() : tab === 'plan' ? vPlan() : vProg();
    main.scrollTop = top;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
    const f = $('formPausa');
    if (f) f.onsubmit = ev => {
      ev.preventDefault();
      const desde = $('pDesde').value, hasta = $('pHasta').value, motivo = $('pMotivo').value.trim() || 'Salida';
      if (!desde || !hasta || hasta < desde) return avisar('Revisa las fechas');
      registrar('pausa', { desde, hasta, motivo, dia: desde }, 'Apuntado: ' + motivo);
    };
    pintarEstado();
  }

  /* ---------- Hojas ---------- */
  function abrirHoja() { hoja.classList.add('abierta'); }
  function cerrar() {
    if (ses && ses.id) clearInterval(ses.id);
    if (desc) { clearInterval(desc.id); desc = null; }
    soltarPantalla();
    hoja.classList.remove('abierta');
    ses = null;
  }
  function cabecera(eti, tit, sub) {
    return `<header class="sh-top"><div><span class="eti">${esc(eti)}</span><h2>${esc(tit)}</h2>${sub ? `<small>${esc(sub)}</small>` : ''}</div><button class="x" data-cerrar aria-label="Cerrar">${ico.x}</button></header>`;
  }

  // Un día del plan: empezar, mover, saltar o borrar lo hecho.
  function abrirDia(d) {
    const hoy = hoyDe(), x = P.dia(E, d);
    ses = { k: 'dia', dia: d };
    const huecos = [];
    for (let i = 0; i < 14; i++) {
      const h = P.diaMas(d < hoy ? hoy : P.lunes(d), i);
      if (h === d || h < hoy) continue;
      const y = P.dia(E, h);
      if (y.pausa || y.hecho) continue;
      huecos.push(y);
      if (huecos.length >= 8) break;
    }
    let cuerpo = '';
    if (x.pausa) cuerpo = `<p class="msg">${esc(x.pausa)}: ese día no hay entreno.</p>`;
    else if (!x.tipo) cuerpo = '<p class="msg">Ese día descansas.</p>';
    else if (x.hecho) cuerpo = `<p class="msg">Hecho: ${esc(resumenDe(x.hecho))}.</p><button class="btn sec ancho" data-borrar="${x.hecho.id}">Borrar esta sesión</button>`;
    else {
      cuerpo = `<p class="sub">${esc(P.detalle(E, x))}</p>`;
      if (x.tipo === 'A' || x.tipo === 'B') cuerpo += `<ul class="listado">${P.SESIONES[x.tipo].map(([par, id]) => `<li><b>${par}</b> ${esc(P.EJ[id].n)}</li>`).join('')}</ul>`;
      if (x.saltado) cuerpo += `<p class="msg">Saltado.</p><button class="btn sec ancho" data-volver="${d}">Deshacer</button>`;
      else {
        cuerpo += `<button class="btn ancho" data-abrir="${d}">Empezar</button>`;
        if (huecos.length) cuerpo += `<span class="eti">Cambiar por otro día</span><div class="chips">${huecos.map(y => `<button data-mover="${d}" data-a="${y.dia}">${P.corta(y.dia).slice(0, 3)} ${Number(y.dia.slice(8))}<small>${y.tipo ? ({ A: 'A', B: 'B', test: 'prueba', run: 'correr', sab: 'mov.' })[y.tipo] : 'libre'}</small></button>`).join('')}</div><p class="peq">Se intercambian los dos días.</p>`;
        cuerpo += `<button class="btn sec ancho" data-saltar="${d}">Saltar este día</button>`;
      }
    }
    hoja.innerHTML = `${cabecera(etiFecha(d, hoy), x.pausa || P.titulo(x.tipo), x.tipo && !x.pausa ? x.hora : '')}<div class="sh-main fin">${cuerpo}</div>`;
    abrirHoja();
  }

  function abrir(d) {
    const x = P.dia(E, d);
    if (!x.tipo || x.pausa) return;
    if (x.tipo === 'A' || x.tipo === 'B') {
      abiertos.clear();
      ses = { k: 'cal', dia: d, plan: x.tipo, sel: null, fin: false, items: P.SESIONES[x.tipo].map(([par, id, n]) => {
        const e = P.EJ[id], ult = E.ult[id] || [], sg = P.sugerir(e, E.paso[id], ult, n);
        return { par, id, e, paso: E.paso[id], ult, obj: sg.obj, sube: sg.sube, nuevo: sg.nuevo, hechas: Array(n).fill(null) };
      }) };
    } else if (x.tipo === 'test') {
      const u = E.pruebas[E.pruebas.length - 1];
      ses = { k: 'test', dia: d, v: { dominadas: u.dominadas, fondos: u.fondos, flexiones: u.flexiones }, mu: false };
    } else if (x.tipo === 'run') {
      const tr = P.tramosCorrer(E.correr.sem, P.semanaDia(d) === 6);
      ses = { k: 'run', dia: d, sem: E.correr.sem, sens: null, rod: null, ...nuevoTimer(tr) };
    } else ses = { k: 'mov', dia: d, lista: 'sab', ...nuevoTimer(P.tramosMov('sab')) };
    pintarHoja();
    abrirHoja();
  }
  function abrirMov(id) {
    ses = { k: 'mov', dia: null, lista: id, ...nuevoTimer(P.tramosMov(id)) };
    pintarHoja();
    abrirHoja();
  }
  function pintarHoja() {
    if (ses.k === 'cal') return ses.fin ? vFinCal() : vCal();
    if (ses.k === 'test') return vTest();
    if (ses.fin) return ses.k === 'run' ? vFinRun() : vFinMov();
    vTimer();
  }
  const etiSes = () => ses.dia == null ? 'Después de la sesión' : etiFecha(ses.dia, hoyDe());

  /* Calistenia */
  function bloque(it, ei) {
    const e = it.e, s = e.u === 's' ? ' s' : '';
    const paso = it.paso + (it.sube ? 1 : 0);
    const sel = ses.sel && ses.sel.e === ei ? ses.sel.s : -1;
    return `<section class="ej">
      <div class="ej-top"><span class="par">${it.par}</span><b>${esc(e.n)}</b><span class="chip">${it.obj.length} × ${e.r[0]}–${e.r[1]}${s}</span></div>
      ${e.nota ? `<span class="nota">${esc(e.nota)}</span>` : ''}
      <span class="ult">${it.nuevo ? 'Primera vez: empieza por abajo del rango' : 'Última vez: ' + it.ult.join(' · ') + s}${it.sube ? '<em class="sube">↑ subes de escalón</em>' : ''}</span>
      <div class="series">${it.hechas.map((r, si) => {
        const o = it.obj[si], cls = r == null ? '' : r < o ? 'ok corta' : 'ok';
        return `<button class="serie ${cls} ${si === sel ? 'sel' : ''}" data-e="${ei}" data-s="${si}" aria-label="Serie ${si + 1}: ${r == null ? 'objetivo ' + o : r + ' hechas'}">${r == null ? o : r}</button>`;
      }).join('')}</div>
      ${sel >= 0 ? `<div class="paso"><span>Serie ${sel + 1}</span><button data-mas="-1" aria-label="Menos">−</button><b>${it.hechas[sel]}${s || ' repes'}</b><button data-mas="1" aria-label="Más">+</button></div>` : ''}
      <details class="esc" data-i="${ei}" ${abiertos.has(ei) ? 'open' : ''}><summary>Cómo se hace · ${esc(e.esc[paso])}</summary>${como(it.id, e, paso)}</details>
    </section>`;
  }
  function vCal() {
    const prev = hoja.querySelector('.sh-main'), top = prev ? prev.scrollTop : 0;
    hoja.innerHTML = `${cabecera(etiSes(), P.titulo(ses.plan), 'En parejas: 1a, descanso, 1b, descanso…')}
      <div class="sh-main"><p class="calienta"><b>Calentamiento 5′</b> · brazos y muñecas, 10 scapular pulls, 10 sentadillas, círculos de cadera y 5 flexiones fáciles.</p>
      ${ses.items.map(bloque).join('')}
      <p class="regla">Toca una serie al acabarla: se apunta con el objetivo y empieza el descanso. Si hiciste otra cifra, corrígela con − y +. Cuando hagas todas las series en lo más alto del rango, la próxima vez subes de escalón.</p></div>
      <footer class="sh-pie" id="pie"></footer>`;
    hoja.querySelector('.sh-main').scrollTop = top;
    montarDibujos(hoja);
    pintarPie();
  }
  function pintarPie() {
    const pie = $('pie');
    if (!pie || !ses || ses.k !== 'cal') return;
    const tot = ses.items.reduce((a, it) => a + it.hechas.length, 0);
    const hechas = ses.items.reduce((a, it) => a + it.hechas.filter(v => v != null).length, 0);
    pie.innerHTML = desc
      ? `<div class="descanso"><div><span class="eti">Descanso</span><b id="dt">${mmss(desc.s)}</b></div><button class="btn sec" data-desc="30">+30 s</button><button class="btn" data-desc="0">Seguir</button></div><div class="barrita"><em id="db" style="width:${100 * desc.s / desc.tot}%"></em></div>`
      : `<button class="btn ancho" data-fin ${hechas ? '' : 'disabled'}>Terminar · ${hechas} de ${tot} series</button>`;
  }
  function tocarSerie(ei, si) {
    audio();
    const it = ses.items[ei];
    if (it.hechas[si] == null) {
      it.hechas[si] = it.obj[si];
      ses.sel = { e: ei, s: si };
      empezarDescanso(it.e.u === 's' ? 60 : 75);
    } else ses.sel = ses.sel && ses.sel.e === ei && ses.sel.s === si ? null : { e: ei, s: si };
    vCal();
  }
  function ajustar(d) {
    const it = ses.items[ses.sel.e], st = it.e.u === 's' ? 5 : 1;
    it.hechas[ses.sel.s] = Math.max(0, it.hechas[ses.sel.s] + d * st);
    vCal();
  }
  function empezarDescanso(s) {
    if (desc) clearInterval(desc.id);
    desc = { s, tot: s, id: setInterval(() => {
      desc.s--;
      if (desc.s <= 0) { pitido(880, .25); setTimeout(() => pitido(1175, .3), 280); pararDescanso(); return; }
      if (desc.s <= 3) pitido(660, .08);
      const dt = $('dt'), db = $('db');
      if (dt) dt.textContent = mmss(desc.s);
      if (db) db.style.width = 100 * desc.s / desc.tot + '%';
    }, 1000) };
  }
  function pararDescanso() { if (desc) clearInterval(desc.id); desc = null; pintarPie(); }
  function vFinCal() {
    let rep = 0, prev = 0;
    const estrena = [], prox = [];
    ses.items.forEach(it => {
      const hizo = it.hechas.some(v => v != null);
      if (it.e.u !== 's') { rep += it.hechas.reduce((a, v) => a + (v || 0), 0); prev += it.ult.reduce((a, v) => a + v, 0); }
      if (it.sube && hizo) estrena.push(`<b>${esc(it.e.n)}</b>: ${esc(it.e.esc[it.paso + 1].toLowerCase())}`);
      else if (!it.sube && it.hechas.every(v => v != null && v >= it.e.r[1]) && it.paso < it.e.esc.length - 1) prox.push(`<b>${esc(it.e.n)}</b> → ${esc(it.e.esc[it.paso + 1].toLowerCase())}`);
    });
    const dif = rep - prev;
    hoja.innerHTML = `${cabecera(etiSes(), 'Hecho', P.titulo(ses.plan))}
      <div class="sh-main fin">
        <div class="grande">${rep} <small>repes</small></div>
        ${prev ? `<p class="sub">${dif >= 0 ? '+' : ''}${dif} que la última vez${estrena.length ? ' (al subir de escalón se empieza por abajo del rango)' : ''}</p>` : ''}
        ${estrena.length ? `<span class="eti">Has estrenado escalón</span><ul class="listado">${estrena.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
        ${prox.length ? `<span class="eti">La próxima vez subes</span><ul class="listado">${prox.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
        <p class="msg">La próxima vez: una repe más por serie hasta llegar al tope del rango.</p>
      </div>
      <footer class="sh-pie"><button class="btn sec ancho" data-guardar-mov="sup">Guardar y hacer movilidad · ${P.minutos(P.tramosMov('sup'))}′</button><button class="btn ancho" data-guardar>Guardar</button></footer>`;
  }

  /* Prueba de 4 semanas */
  function vTest() {
    const u = E.pruebas[E.pruebas.length - 1];
    hoja.innerHTML = `${cabecera(etiSes(), 'Prueba', 'Una serie al máximo de cada uno, con 3 min de descanso')}
      <div class="sh-main"><p class="calienta"><b>Calentamiento 5′</b> como siempre y una serie suave de cada uno.</p>
      ${P.PRUEBA.map(([id, n, nota]) => `<section class="prueba"><div class="ej-top"><b>${n}</b><span class="chip">antes: ${u[id]}</span></div><span class="sub">${nota}</span>
        <div class="contador"><button data-prueba="${id}" data-d="-1" aria-label="Menos">−</button><b>${ses.v[id]}</b><button data-prueba="${id}" data-d="1" aria-label="Más">+</button></div></section>`).join('')}
      <label class="marca"><input type="checkbox" id="mu" ${ses.mu ? 'checked' : ''}> Me ha salido un muscle-up</label></div>
      <footer class="sh-pie"><button class="btn ancho" data-guardar>Guardar prueba</button></footer>`;
    $('mu').onchange = ev => { ses.mu = ev.target.checked; };
  }

  /* Cronómetro: correr y movilidad */
  function nuevoTimer(fases) { return { fases, i: 0, rest: fases[0].s, run: false, rapido: false, fin: false, id: null }; }
  function vTimer() {
    const run = ses.k === 'run';
    const tit = run ? 'Correr' : P.MOV[ses.lista].n;
    const sub = run ? `Semana ${ses.sem + 1}${ses.sem < P.CORRER.length ? ' de 9' : ''} · ${P.correrDe(ses.sem).texto}` : `${P.minutos(ses.fases)} min · ${ses.fases.filter(f => f.k === 'mov').length} posturas`;
    hoja.innerHTML = `${cabecera(etiSes(), tit, sub)}
      <div class="reloj-zona">${run ? '' : '<div class="postura" id="postura"></div>'}<span class="fase" id="fase"></span><b class="reloj ${run ? '' : 'chico'}" id="reloj"></b><span class="tramo" id="tramo"></span>
        <div class="tira">${ses.fases.map(f => `<i class="t-${f.k}" style="flex-grow:${f.s}"><em></em></i>`).join('')}</div>
        <span class="prox" id="prox"></span></div>
      <footer class="sh-pie"><div class="ctl"><button class="btn sec" data-saltar-tramo>Saltar</button><button class="play" id="play" data-play aria-label="Empezar">${ico.play}</button><button class="btn sec" data-terminar>Terminar</button></div>
      <p class="nota-pie">${run ? 'Pitido en cada cambio, con el sonido activado · ritmo de poder hablar' : 'Pitido en cada cambio, con el sonido activado · respira lento'}</p></footer>`;
    ses.dibujo = null;
    actT();
  }
  function actT() {
    const f = ses.fases[ses.i], fase = $('fase');
    if (!fase) return;
    fase.textContent = f.n;
    fase.className = 'fase k-' + f.k;
    $('reloj').textContent = mmss(ses.rest);
    const queda = ses.rest + ses.fases.slice(ses.i + 1).reduce((a, x) => a + x.s, 0);
    $('tramo').textContent = `Tramo ${ses.i + 1} de ${ses.fases.length} · quedan ${mmss(queda)}`;
    hoja.querySelectorAll('.tira em').forEach((em, j) => { em.style.width = j < ses.i ? '100%' : j > ses.i ? '0%' : 100 * (1 - ses.rest / f.s) + '%'; });
    const nx = ses.fases[ses.i + 1];
    $('prox').textContent = nx ? `Después: ${nx.n} · ${P.fm(nx.s)}` : 'Último tramo';
    const caja = $('postura');
    if (caja && ses.dibujo !== f.d) {
      ses.dibujo = f.d;
      caja.textContent = '';
      if (f.d && DIBUJOS[f.d]) { const d = crearDibujo(f.d); caja.appendChild(d.svg); animarDibujo(d); }
    }
  }
  function relojT() { clearInterval(ses.id); ses.id = ses.run ? setInterval(tick, ses.rapido ? 50 : 1000) : null; }
  function tick() {
    if (!ses || ses.fin) return;
    ses.rest--;
    if (ses.rest <= 0) return avanzar();
    if (ses.rest <= 3 && !ses.rapido) pitido(660, .08);
    actT();
  }
  function avanzar() {
    ses.i++;
    if (ses.i >= ses.fases.length) { ses.i = ses.fases.length - 1; ses.rest = 0; return terminarT(); }
    ses.rest = ses.fases[ses.i].s;
    pitido(ses.fases[ses.i].k === 'run' ? 1175 : 880, .3);
    actT();
  }
  function playPausa() {
    audio();
    ses.run = !ses.run;
    if (ses.run) pedirPantalla();
    relojT();
    const p = $('play');
    p.innerHTML = ses.run ? ico.pausa : ico.play;
    p.setAttribute('aria-label', ses.run ? 'Pausa' : 'Seguir');
  }
  function terminarT() {
    clearInterval(ses.id);
    ses.run = false;
    ses.fin = true;
    pitido(880, .2);
    setTimeout(() => pitido(1320, .5), 220);
    soltarPantalla();
    ses.k === 'run' ? vFinRun() : vFinMov();
  }
  // Minutos hechos de verdad (si terminas antes, cuenta hasta donde llegaste).
  function hecho(tipo) {
    return ses.fases.reduce((a, f, j) => a + (j < ses.i ? f.s : j === ses.i ? f.s - ses.rest : 0) * (!tipo || f.k === tipo ? 1 : 0), 0);
  }
  function mensajeRun() {
    if (ses.sens == null || ses.rod == null) return null;
    const c = E.correr, n = c.sem + 1;
    if (ses.rod > 3) return { mal: true, t: `Ha pasado de 3: la semana ${n} vuelve a empezar. Si va a más mientras corres, para y vuelve andando. Mañana te pregunto cómo amanece.` };
    if (ses.sens === 'duro' && c.duros >= 1) return { t: `Segunda salida dura seguida: repites la semana ${n}. Sin prisa.` };
    if (ses.sens === 'duro') return { t: `Anotado. Si la siguiente también sale dura, repites la semana ${n}. Mañana te pregunto por la rodilla.` };
    if (c.hechas + 1 >= 3) return { t: c.sem + 1 < P.CORRER.length ? `Semana ${n} completa. La siguiente: ${P.correrDe(c.sem + 1).texto}.` : c.sem + 1 === P.CORRER.length ? 'Fase 1 completa: ya corres 30′ seguidos.' : `Semana ${n} completa.` };
    const q = 3 - c.hechas - 1;
    return { t: `Bien. Te ${q === 1 ? 'queda 1 salida' : `quedan ${q} salidas`} de la semana ${n}. Mañana te pregunto por la rodilla.` };
  }
  function vFinRun() {
    const corr = Math.round(hecho('run') / 60), tot = Math.round(hecho() / 60);
    const m = mensajeRun(), listo = !!m;
    hoja.innerHTML = `${cabecera(etiSes(), 'Hecho', `Semana ${ses.sem + 1} · salida ${E.correr.hechas + 1} de 3`)}
      <div class="sh-main fin">
        <div class="grande">${tot} <small>min · ${corr} corriendo</small></div>
        <span class="eti">¿Cómo ha ido?</span>
        <div class="elige">${[['facil', 'Fácil'], ['bien', 'Bien'], ['duro', 'Duro']].map(([v, t]) => `<button class="${ses.sens === v ? 'on' : ''}" data-sens="${v}">${t}</button>`).join('')}</div>
        <span class="eti">Rodilla derecha mientras corrías</span>
        <div class="escala">${[0, 1, 2, 3, 4, 5, 6].map(v => `<button class="${v > 3 ? 'alto' : ''} ${ses.rod === v ? 'on' : ''}" data-rodn="${v}" aria-label="${v === 6 ? '6 o más' : v}">${v === 6 ? '6+' : v}</button>`).join('')}</div>
        <p class="peq">0 es nada. El límite es 3.</p>
        ${m ? `<p class="msg ${m.mal ? 'mal' : ''}">${m.t}</p>` : ''}
      </div>
      <footer class="sh-pie"><button class="btn sec ancho" data-guardar-mov="cad" ${listo ? '' : 'disabled'}>Guardar y hacer movilidad · ${P.minutos(P.tramosMov('cad'))}′</button><button class="btn ancho" data-guardar ${listo ? '' : 'disabled'}>Guardar</button></footer>`;
  }
  function vFinMov() {
    const min = Math.max(1, Math.round(hecho() / 60));
    hoja.innerHTML = `${cabecera(etiSes(), 'Hecho', P.MOV[ses.lista].n)}
      <div class="sh-main fin"><div class="grande">${min} <small>min de movilidad</small></div>
      <p class="msg">${ses.lista === 'cad' ? 'La almeja y el lateral de cadera son lo que más ayuda a la cintilla. Bien hecho.' : ses.lista === 'sab' ? 'Hecho. Ya puedes ir al cau.' : 'Hecho. A la ducha.'}</p></div>
      <footer class="sh-pie"><button class="btn ancho" data-guardar>${ses.dia ? 'Guardar' : 'Cerrar'}</button></footer>`;
  }

  function guardar() {
    if (!ses) return;
    const hoy = hoyDe();
    if (ses.k === 'cal') {
      const series = {}, sube = [];
      ses.items.forEach(it => {
        if (!it.hechas.some(v => v != null)) return;
        series[it.id] = it.hechas.slice();
        if (it.sube) sube.push(it.id);
      });
      registrar('sesion', { dia: hoy, para: ses.dia, plan: ses.plan, series, sube }, 'Sesión guardada');
    } else if (ses.k === 'test') {
      registrar('sesion', { dia: hoy, para: ses.dia, plan: 'test', prueba: Object.assign({}, ses.v, ses.mu ? { muscleup: true } : {}) }, 'Prueba guardada');
    } else if (ses.k === 'run') {
      if (!mensajeRun()) return;
      registrar('sesion', { dia: hoy, para: ses.dia, plan: 'run', sem: ses.sem, sens: ses.sens, rodilla: ses.rod, corriendo: Math.round(hecho('run') / 60), minutos: Math.round(hecho() / 60) }, 'Salida guardada');
    } else if (ses.k === 'mov' && ses.dia) {
      registrar('sesion', { dia: hoy, para: ses.dia, plan: 'sab', minutos: Math.max(1, Math.round(hecho() / 60)) }, 'Movilidad guardada');
    }
    cerrar();
  }

  /* ---------- Ajustes ---------- */
  function abrirAjustes() {
    ses = { k: 'ajustes' };
    const exec = API ? API + '?k=' + encodeURIComponent(K) : '';
    const ultimo = LOG.concat(COLA).filter(e => e.tipo !== 'deshacer').sort((a, b) => (a.cuando < b.cuando ? 1 : -1))[0];
    hoja.innerHTML = `${cabecera('Tangerine', 'Ajustes', '')}
      <div class="sh-main">
        <div class="ajuste"><div><b>Entrenos en Google Calendar</b><small>Los próximos 14 días, en color mandarina y con aviso 10 min antes. Se actualizan solos.</small></div><button class="interruptor" role="switch" aria-checked="${CALENDARIO}" data-calendario aria-label="Entrenos en Google Calendar"></button></div>
        <div class="ajuste"><div><b>Por enviar</b><small>${COLA.length ? COLA.length + ' cambios guardados en el móvil. Se envían solos cuando hay conexión.' : 'Todo está guardado en tu hoja.'}</small></div>${COLA.length && conectado() ? '<button class="btn sec peque" data-enviar>Enviar</button>' : ''}</div>
        ${ultimo ? `<div class="ajuste"><div><b>Deshacer lo último</b><small>${esc(({ sesion: 'Sesión', rodilla: 'Rodilla', mover: 'Cambio de día', saltar: 'Día saltado', pausa: 'Salida o viaje', quitarPausa: 'Quitar salida' })[ultimo.tipo] || ultimo.tipo)} · ${P.corta(ultimo.dia || ultimo.de || ultimo.desde || hoyDe())}</small></div><button class="btn sec peque" data-borrar="${ultimo.id}">Deshacer</button></div>` : ''}
        <div class="ajuste"><div><b>Widget del iPhone</b><small>En la app Scriptable, crea un script nuevo y pega el código que sale en esta dirección. Luego añade un widget de Scriptable a la pantalla de inicio.</small>${exec ? `<input class="enlace" readonly value="${esc(exec + '&accion=scriptable')}" data-copiar>` : '<small>Abre Tangerine desde tu enlace para ver la dirección.</small>'}</div></div>
        <div class="ajuste"><div><b>Atajo «Entreno de hoy»</b><small>Acción «Obtén el contingut de l'URL» con esta dirección y luego «Llegeix el text». Siri te dice qué toca.</small>${exec ? `<input class="enlace" readonly value="${esc(exec + '&accion=hoy')}" data-copiar>` : ''}</div></div>
        <div class="ajuste"><div><b>Sonido</b><small>Los pitidos del descanso y del cronómetro no suenan si el iPhone está en silencio. Safari no deja vibrar a las webs.</small></div></div>
      </div>`;
    hoja.querySelectorAll('[data-copiar]').forEach(i => i.addEventListener('click', () => {
      i.select();
      try { navigator.clipboard.writeText(i.value).then(() => avisar('Copiado'), () => {}); } catch (e) {}
    }));
    abrirHoja();
  }
  async function cambiarCalendario(b) {
    const v = b.getAttribute('aria-checked') !== 'true';
    if (DEMO) { CALENDARIO = v; b.setAttribute('aria-checked', v); return; }
    if (!conectado()) return avisar('Necesita conexión');
    b.disabled = true;
    try {
      const r = await run('accion', 'ajuste', { calendario: v });
      aplicar(r.datos);
      b.setAttribute('aria-checked', CALENDARIO);
      avisar(CALENDARIO ? 'Calendario activado' : 'Calendario apagado');
    } catch (e) { avisar('No se pudo: ' + e.message); }
    b.disabled = false;
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', ev => {
    const g = ev.target.closest('[data-pt]');
    if (g) { ptSel = +g.dataset.pt; return pintar(); }
    const b = ev.target.closest('button');
    if (!b || b.disabled) return;
    const ds = b.dataset;
    if (ds.tab) { tab = ds.tab; LS.set('tab', tab); pintar(); main.scrollTop = 0; }
    else if (ds.abrir) { cerrar(); abrir(ds.abrir); }
    else if (ds.dia) abrirDia(ds.dia);
    else if (ds.cerrar != null) cerrar();
    else if (ds.masAjustes != null) abrirAjustes();
    else if (ds.e != null) tocarSerie(+ds.e, +ds.s);
    else if (ds.mas) ajustar(+ds.mas);
    else if (ds.desc) { if (+ds.desc) { desc.s += +ds.desc; desc.tot = Math.max(desc.tot, desc.s); pintarPie(); } else pararDescanso(); }
    else if (ds.fin != null) { if (desc) { clearInterval(desc.id); desc = null; } ses.fin = true; vFinCal(); }
    else if (ds.guardar != null) guardar();
    else if (ds.guardarMov) { const id = ds.guardarMov; guardar(); abrirMov(id); }
    else if (ds.play != null) playPausa();
    else if (ds.saltarTramo != null) { audio(); avanzar(); }
    else if (ds.terminar != null) terminarT();
    else if (ds.sens) { ses.sens = ds.sens; vFinRun(); }
    else if (ds.rodn != null) { ses.rod = +ds.rodn; vFinRun(); }
    else if (ds.prueba) { ses.v[ds.prueba] = Math.max(0, ses.v[ds.prueba] + +ds.d); vTest(); }
    else if (ds.rod) registrar('rodilla', { dia: hoyDe(), valor: ds.rod }, 'Apuntado');
    else if (ds.mover) { cerrar(); registrar('mover', { de: ds.mover, a: ds.a, dia: ds.mover }, 'Cambiado al ' + nombreDia(ds.a)); }
    else if (ds.saltar) { cerrar(); registrar('saltar', { dia: ds.saltar }, 'Saltado'); }
    else if (ds.volver) {
      const s = LOG.concat(COLA).filter(e => e.tipo === 'saltar' && e.dia === ds.volver);
      cerrar();
      s.forEach(e => registrar('deshacer', { ref: e.id, dia: ds.volver }));
      avisar('Deshecho');
    }
    else if (ds.borrar) { cerrar(); registrar('deshacer', { ref: ds.borrar, dia: hoyDe() }, 'Deshecho'); }
    else if (ds.quitarPausa) registrar('quitarPausa', { ref: ds.quitarPausa, dia: hoyDe() }, 'Quitado');
    else if (ds.sem) { semOff = +ds.sem; pintar(); }
    else if (ds.mes) { mesOff += +ds.mes; pintar(); }
    else if (ds.calendario != null) cambiarCalendario(b);
    else if (ds.enviar != null) { enviar(); cerrar(); }
  });
  document.addEventListener('toggle', ev => {
    const d = ev.target;
    if (!d.matches || !d.matches('details.esc')) return;
    if (d.open) montarDibujos(d); else d.querySelectorAll('.dj-slot').forEach(s => { s.textContent = ''; });
    if (d.dataset.i == null) return;
    const i = +d.dataset.i;
    d.open ? abiertos.add(i) : abiertos.delete(i);
  }, true);

  recalcular();
  if (!DEMO && !EN_GOOGLE && !(API && K)) pantallaClave('');
  else { pintar(); cargar(); }
</script>
</body>
</html>
